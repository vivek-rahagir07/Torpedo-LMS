<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#ff7043"/>
  <!-- Antenna -->
  <rect x="47" y="10" width="6" height="14" rx="3" fill="#ffab91"/>
  <circle cx="50" cy="10" r="5" fill="#ffd54f"/>
  <!-- Ears -->
  <rect x="12" y="44" width="8" height="16" rx="4" fill="#d84315"/>
  <rect x="80" y="44" width="8" height="16" rx="4" fill="#d84315"/>
  <!-- Head -->
  <rect x="18" y="24" width="64" height="56" rx="14" fill="#ff5722"/>
  <!-- Screen/Visor -->
  <rect x="25" y="32" width="50" height="30" rx="8" fill="#263238"/>
  <!-- Eyes -->
  <rect x="33" y="40" width="12" height="14" rx="3" fill="#00e676"/>
  <circle cx="36" cy="44" r="2" fill="#ffffff"/>
  <circle cx="64" cy="47" r="5" fill="#00e676"/>
  <circle cx="63" cy="45" r="2" fill="#ffffff"/>
  <!-- Mouth / Grille -->
  <line x1="36" y1="70" x2="64" y2="70" stroke="#ffd54f" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="67" x2="42" y2="73" stroke="#d84315" stroke-width="2"/>
  <line x1="50" y1="67" x2="50" y2="73" stroke="#d84315" stroke-width="2"/>
  <line x1="58" y1="67" x2="58" y2="73" stroke="#d84315" stroke-width="2"/>
  <!-- Bolts -->
  <circle cx="24" cy="30" r="2" fill="#ffd54f"/>
  <circle cx="76" cy="30" r="2" fill="#ffd54f"/>
</svg>

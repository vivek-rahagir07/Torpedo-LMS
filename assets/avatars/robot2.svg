<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#f3e5f5"/>
  <!-- Antenna with heart -->
  <line x1="50" y1="24" x2="50" y2="12" stroke="#ab47bc" stroke-width="4"/>
  <circle cx="50" cy="10" r="5" fill="#e91e63"/>
  <!-- Head -->
  <rect x="22" y="24" width="56" height="52" rx="18" fill="#ba68c8"/>
  <!-- Face Screen -->
  <rect x="28" y="32" width="44" height="34" rx="10" fill="#4a148c"/>
  <!-- Screen Eyes (dots/slits) -->
  <circle cx="40" cy="48" r="4.5" fill="#00e5ff"/>
  <circle cx="60" cy="48" r="4.5" fill="#00e5ff"/>
  <circle cx="39" cy="46" r="1.5" fill="#ffffff"/>
  <circle cx="59" cy="46" r="1.5" fill="#ffffff"/>
  <!-- Screen Smile -->
  <path d="M46 54 Q50 58 54 54" stroke="#00e5ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Ear Dials -->
  <circle cx="18" cy="50" r="4" fill="#7b1fa2"/>
  <circle cx="82" cy="50" r="4" fill="#7b1fa2"/>
</svg>

t="image/*" onchange="if(this.files[0]){let r=new FileReader();r.onload=()=>{draft.cover=r.result;render()};r.readAsDataURL(this.files[0])}"></label><label class="row"><input type="checkbox" style="width:auto" checked> Unlock modules sequentially each week</label></div>`:courseStep===1?`<p>Organize your course into clear, achievable milestones.</p><div style="margin:20px 0">${draft.modules.map((m,i)=>`<div class="activity row between"><b>${i+1}. ${esc(m)}</b><button onclick="draft.modules.splice(${i},1);render()">Remove</button></div>`).join('')||'<div class="empty">Your learning journey starts with one module.</div>'}</div><div class="row"><input id="module" placeholder="Module title">${button('Add Module',"let v=$('#module').value.trim();if(v){draft.modules.push(v);render()}")}</div>`:courseStep===2?`<div class="stack"><label>Price (₹)<input type="number" min="0" value="${draft.price}" oninput="draft.price=this.value"></label><label>SEO title<input value="${esc(draft.seo||draft.title)}" oninput="draft.seo=this.value"></label><label>Meta description<textarea placeholder="A short introduction for search engines" oninput="draft.meta=this.value">${esc(draft.meta||'')}</textarea></label></div>`:`<div class="stack"><p>Review your course before submitting it to Super Admin.</p><div class="card"><h3>${esc(draft.title||'Untitled Course')}</h3><p>${esc(draft.category)} · ${draft.modules.length} modules · ₹${esc(draft.price)}</p></div><label>Frequently asked questions<textarea placeholder="Add helpful answers for your learners" oninput="draft.faq=this.value">${esc(draft.faq||'')}</textarea></label><span class="pill">Your course goes live only after Super Admin approval.</span></div>`}</section></div><aside class="stack" style="align-content:start"><section class="card"><div class="eyebrow">WIZARD CONTROLS</div><button class="primary" style="width:100%;margin:18px 0 12px;background:linear-gradient(90deg,#17376b,#2c5be4)" onclick="if(courseStep<3){courseStep++;render()}else publishCourse()">${courseStep<3?'CONTINUE STEP →':'SUBMIT FOR APPROVAL →'}</button><div class="row">${button('Save Draft',"saveDraft()",'secondary')}${button('← Back',"if(courseStep>0){courseStep--;render()}",'secondary')}</div></section><section class="card"><div class="eyebrow" style="margin-bottom:18px">LIVE CATALOG PREVIEW</div>${draft.cover?`<img src="${draft.cover}" style="width:100%;height:160px;object-fit:cover;border-radius:12px">`:'<div class="course-art">AI</div>'}<span class="badge" style="margin:20px 0 12px">${esc(draft.category)}</span><h3 id="previewtitle">${esc(draft.title||'Untitled Course')}</h3><p style="font-size:12px;margin:10px 0">By ${esc(profile.first+' '+profile.last)}</p><div class="divider"></div><b>₹${esc(draft.price)}</b><span class="pill" style="float:right">${draft.difficulty}</span></section></aside></div>`}
function notifications(){modal('You’re all caught up',`<p>You have 2 project reviews and 2 mentoring sessions today.</p><br><button class=primary onclick="closeModal();go('Evaluations')">Review submissions →</button>`)}
function storeCourse(c){c.id=c.id||('course-'+Date.now());c.author=c.author||[profile.title,profile.first,profile.last].filter(Boolean).join(' ');c.authorEmail=c.authorEmail||profile.email;if(draft.editIndex!==undefined){courses[draft.editIndex]=c}else{courses.push(c)}persist();if(window.TorpedoAPI&&window.TorpedoAPI.createCourse){window.TorpedoAPI.createCourse({id:c.id,title:c.title,category:c.category||'development',instructor:c.author,price:c.price||'₹14,999',syllabus:c.modules||[]}).catch(e=>console.warn('Backend course sync:',e));}}
function saveDraft(){if(!draft.title.trim())return toast('Add a course title first');storeCourse({...draft,students:draft.students||0,progress:draft.progress||25,art:draft.art||'{ }',color:draft.color||'',status:'Draft'});toast('Course draft saved');go('My Courses')}function publishCourse(){if(!draft.title.trim()||!draft.modules.length)return toast('Add a course title and at least one module before publishing');storeCourse({...draft,students:draft.students||0,progress:draft.progress||0,art:draft.art||'{ }',color:draft.color||'',id:draft.id||('course-'+Date.now()),author:profile.title+' '+profile.first+' '+profile.last,authorEmail:profile.email,submittedAt:new Date().toISOString(),reviewNote:'',reviewedAt:null,status:'Pending approval'});toast('Course submitted to Super Admin for review');go('My Courses')}function editCourse(i){draft={price:'999',modules:[],...courses[i],editIndex:i};courseStep=0;go('Course Studio')}
function postJob(){return head('Post a Job','Connect exceptional students with their next opportunity.')+`<form class="card stack" style="max-width:800px" onsubmit="event.preventDefault();jobs.push({title:this.title.value,company:this.company.value,type:this.type.value,location:this.location.value});localStorage.setItem('torpedoJobs',JSON.stringify(jobs));go('Manage Jobs');toast('Opportunity saved to your workspace')"><div class="formgrid"><label>Job title<input name="title" placeholder="Frontend Developer Intern" required></label><label>Organization<input name="company" required placeholder="Organization name"></label><label>Opportunity type<select name="type"><option>Internship</option><option>Full-time</option><option>Part-time</option></select></label><label>Location<input name="location" required placeholder="Remote / City"></label></div><label>Job description<textarea required placeholder="Responsibilities, requirements, and what makes this opportunity special"></textarea></label><label>Application URL<input type="url" placeholder="https://..."></label><button class="primary" style="justify-self:start">Save opportunity →</button></form>`}
function bulk(){return head('Bulk Onboarding','Less administration. More time for your students.')+`<section class="card" style="max-width:850px"><span class="badge">COHORT IMPORT</span><h2 style="margin:18px 0 8px">Bring your cohort together.</h2><p>Upload a CSV with the columns <b>name,email</b>. Preview the rows before adding them to your local roster.</p><label class="upload" style="padding:40px;text-align:center">⇧<h3 style="margin:12px">Choose a student CSV</h3><input type="file" accept=".csv" onchange="importCSV(this)"></label><div id="csvpreview"></div></section>`}function importCSV(input){if(!input.files[0])return;let reader=new FileReader();reader.onload=()=>{let rows=reader.result.trim().split(/\r?\n/).map(r=>r.split(','));if(rows[0].map(s=>s.trim().toLowerCase()).join(',')!=='name,email')return toast('CSV must start with name,email');let valid=rows.slice(1).filter(r=>r.length===2&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r[1].trim()));window.importRows=valid;$('#csvpreview').innerHTML=`<div class="divider"></div><h3>${valid.length} valid students ready</h3><div class="tablewrap"><table><tr><th>NAME</th><th>EMAIL</th></tr>${valid.slice(0,20).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table></div><button class="primary" style="margin-top:20px" onclick="rosterRows=window.importRows;localStorage.setItem('torpedoRoster',JSON.stringify(rosterRows));toast('Students added to local roster')">Confirm import →</button>`};reader.readAsText(input.files[0])}
function talent(){return head('Talent Sourcing','Discover the people behind the potential.')+`<div class="filter"><input placeholder="Search student names, skills…" oninput="document.querySelectorAll('.talent').forEach(c=>c.hidden=!c.textContent.toLowerCase().includes(this.value.toLowerCase()))"></div><div class="grid three">${[['AS','Ananya Sharma','Full Stack Developer','React · Node.js · PostgreSQL','98'],['RM','Rohan Mehta','Cloud Engineer','Docker · Kubernetes · AWS','95'],['IV','Ishita Verma','Data Science Enthusiast','Python · PyTorch · SQL','92']].map(s=>`<section class="card talent"><div class="row between"><div class="avatar">${s[0]}</div><span class="pill">${s[4]} Skill score</span></div><h2 style="margin:20px 0 8px;font-size:20px">${s[1]}</h2><p>${s[2]}</p><div class="tags"><span class="badge">${s[3]}</span></div><button class="secondary" style="width:100%" onclick="modal('${s[1]}','<p>${s[2]} with hands-on project experience.</p><br><b>Core skills</b><p>${s[3]}</p><div class=divider></div><p>Connect your institution’s student directory to view verified portfolios and contact details.</p>')">View profile →</button></section>`).join('')}</div>`}
function settings(){return head('Faculty Profile','Your expertise. Your story. Your space.',button('Edit full profile →',"mode='onboard';step=0;render()"))+`<section class="card" style="max-width:850px"><div class="row">${av()}<div><h2>${esc(profile.title+' '+profile.first+' '+profile.last)}</h2><p>${esc(profile.email)}</p></div></div><div class="divider"></div><div class="grid two"><div><label>ACADEMIC CREDENTIAL</label><p>${esc(profile.credential)}</p></div><div><label>SPECIALIZATION</label><p>${esc(profile.specialization)}</p></div><div><label>LOCATION</label><p>${esc(profile.city+', '+profile.state)}</p></div><div><label>EXPERIENCE</label><p>${esc(profile.experience)} years</p></div></div><div class="divider"></div><label>BIOGRAPHY</label><p>${esc(profile.bio)}</p><div class="tags">${[...selectedTags].map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div></section>`}
function help(){modal('Academic helpdesk',`<p>A little support goes a long way.</p><div class="stack" style="margin-top:20px"><details><summary>How do I create a course?</summary><p>Open My Courses → Create Course. Add your course details, modules and pricing, then publish.</p></details><details><summary>How do I update my faculty profile?</summary><p>Open your profile at the bottom of the sidebar and choose Edit full profile.</p></details><details><summary>Where is my information saved?</summary><p>This interactive demo stores your profile, courses and roster in this browser. Institutional services require a backend connection.</p></details></div>`)}function addResource(){modal('Add a library resource',`<form onsubmit="event.preventDefault();closeModal();toast('Resource suggestion saved for institutional review')"><label>Resource title<input required></label><label style="margin-top:16px">Publisher / resource URL<input type="url" required placeholder="https://..."></label><button class="primary" style="margin-top:20px">Suggest resource →</button></form>`)}
function exportCSV(){let text='Course,Students,Completion,Status\n'+courses.map(c=>[c.title,c.students,c.progress,c.status].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='torpedo-course-analytics.csv';a.click();URL.revokeObjectURL(a.href);toast('Analytics exported')}
function content(){if(page==='Home')return dashboard();if(page==='My Courses')return head('My Courses','Turn your experience into someone else’s breakthrough.',button('＋ Create Course',"draft={title:'',category:'Web Development',difficulty:'Beginner',price:'999',modules:[]};courseStep=0;go('Course Studio')"))+`<div class="filter"><input placeholder="Search your courses…" value="${esc(query)}" oninput="query=this.value;renderContent()"><select onchange="query=this.value==='All courses'?'':this.value;renderContent()"><option>All courses</option><option>Published</option><option>Pending approval</option><option>Changes requested</option><option>Rejected</option><option>Archived</option><option>Draft</option></select></div><div id="results">${courseCards(courses.filter(c=>(c.title+' '+c.category+' '+c.status).toLowerCase().includes(query.toLowerCase())))}</div>`;if(page==='Course Analytics')return analytics();if(page==='Library Console')return library();if(page==='Evaluations')return evaluations();if(page==='Mentorship Calendar')return calendar();if(page==='Course Studio')return studio();if(page==='Post a Job')return postJob();if(page==='Bulk Onboarding')return bulk();if(page==='Talent Sourcing')return talent();if(page==='Settings')return settings();if(page==='Manage Jobs')return head('Manage Jobs','Open doors for your student community.',button('＋ Post a Job',"go('Post a Job')"))+`<section class="card tablewrap">${jobs.length?`<table><tr><th>OPPORTUNITY</th><th>ORGANIZATION</th><th>TYPE</th><th>LOCATION</th><th>STATUS</th></tr>${jobs.map(j=>`<tr><td><b>${esc(j.title)}</b></td><td>${esc(j.company)}</td><td>${esc(j.type)}</td><td>${esc(j.location)}</td><td><span class="pill">Saved</span></td></tr>`).join('')}</table>`:'<div class="empty"><h2 style="color:var(--ink);margin-bottom:12px">Their next chapter could start with you.</h2><p>No opportunities yet. Add a job or internship to get started.</p></div>'}</section>`}
function renderContent(){let focus=document.activeElement,position=focus?.selectionStart;if(page==='My Courses')$('#results').innerHTML=courseCards(courses.filter(c=>(c.title+' '+c.category+' '+c.status).toLowerCase().includes(query.toLowerCase())));else if(page==='Library Console'||page==='Torpedo Library'){let temp=document.createElement('div');temp.innerHTML=library();$('#results').innerHTML=temp.querySelector('#results').innerHTML}}
function render(){if(mode==='onboard'){$('#app').innerHTML=onboarding();return}$('#app').innerHTML=`<header class="top faculty-top"><div class="row"><button class="mobilemenu" onclick="document.body.classList.toggle('mobile-nav-open')" aria-label="Toggle navigation">${icon('menu')}</button><a href="index.html" class="faculty-brand"><img src="assets/LOGO.png" alt="Torpedo Learning"><span>INSTRUCTOR</span></a></div><div class="faculty-search"><span>${icon('search')}</span><input aria-label="Global search" placeholder="Search courses, resources, students..." onkeydown="if(event.key==='Enter'){let q=this.value;page='My Courses';query=q;context='academic';render()}"><small>⌘K</small></div><div class="row"><button class="header-icon" aria-label="Help and support" onclick="help()">${icon('help')}</button><button class="header-icon" aria-label="Notifications" onclick="notifications()">${icon('bell')}<em>${reviews.filter(r=>r.status==='Pending').length}</em></button><button title="Instructor profile" onclick="go('Settings')">${av()}</button><button class="header-icon signout" aria-label="Sign out" onclick="localStorage.removeItem('torpedo_user');localStorage.removeItem('torpedoSession');location.href='index.html'">${icon('logout')}</button></div></header><div class="faculty-shell ${collapsed?'collapsed':''}"><aside class="faculty-sidebar"><div class="faculty-rail"><button class="rail-control" aria-label="Collapse navigation" onclick="collapsed=!collapsed;render()">${icon('menu')}</button><div class="rail-rule"></div>${[['academic','shield','Teaching & Academics'],['community','globe','Community & Resources'],['workspaces','cube','Workspaces & Careers']].map(([id,ic,label])=>`<button class="rail-control ${context===id?'active':''}" title="${label}" aria-label="${label}" aria-pressed="${context===id}" onclick="setContext('${id}')">${icon(ic)}</button>`).join('')}<div style="flex:1"></div><button class="rail-control ${page==='Settings'?'active':''}" title="Faculty profile & settings" onclick="go('Settings')">${icon('settings')}</button><button title="Instructor profile" onclick="go('Settings')">${av()}</button></div><div class="faculty-panel"><div class="workspace-label">${{academic:'TEACHING WORKSPACE',community:'COMMUNITY & RESOURCES',workspaces:'WORKSPACES & CAREERS'}[context]}</div><div class="panel-nav">${menuHTML()}</div><div class="faculty-panel-bottom"><div class="row"><span class="faculty-status"></span><div><b>${esc(profile.first+' '+profile.last)}</b><small>Instructor · Faculty workspace</small></div></div><button onclick="mode='onboard';step=0;render()">Complete your faculty profile <span>→</span></button></div></div></aside><main class="main">${content()}<p class="workspace-footer">Torpedo Learning · Instructor workspace · Changes saved on this device</p></main></div>`}

function announcements(){return head('Announcements','Keep your learners informed and moving together.',button('＋ Write announcement',"newNotice()"))+`<div class="stack">${notices.map(n=>`<article class="card"><span class="badge">${esc(n.cohort)}</span><h2 style="margin:15px 0 10px">${esc(n.title)}</h2><p style="white-space:pre-wrap">${esc(n.body)}</p><div class="divider"></div><small class="muted">${esc(n.date)} · Saved locally</small></article>`).join('')||'<div class="card empty">No announcements yet. Share a class update, milestone, or reminder.</div>'}</div>`}
function newNotice(){modal('Write an announcement',`<form onsubmit="event.preventDefault();notices.unshift({title:this.title.value,body:this.body.value,cohort:this.cohort.value,date:new Date().toLocaleDateString()});localStorage.setItem('torpedoNotices',JSON.stringify(notices));closeModal();render();toast('Announcement saved to your workspace')"><label>Title<input name="title" required></label><label>Audience<select name="cohort"><option>All my students</option>${cohorts.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></label><label>Message<textarea name="body" required></textarea></label><button class="primary">Save announcement →</button></form>`)}
function resources(){return head('Resource Contributions','Build a thoughtful reading collection for your learners.',button('＋ Add resource',"addResource()"))+`<div class="grid three">${resourceRows.map(r=>`<article class="card"><span class="badge">TEACHING RESOURCE</span><h2 style="margin:18px 0">${esc(r.title)}</h2><p>${esc(r.description)}</p><a class="primary" style="display:inline-block;margin-top:20px;text-decoration:none" href="${esc(r.url)}" target="_blank" rel="noopener">Open resource ↗</a></article>`).join('')||'<div class="card empty">Add a publication, reading reference, or learning link to your collection.</div>'}</div>`}
addResource=function(){modal('Add a teaching resource',`<form onsubmit="event.preventDefault();resourceRows.push({title:this.title.value,url:this.url.value,description:this.description.value});localStorage.setItem('torpedoResources',JSON.stringify(resourceRows));closeModal();render();toast('Resource added')"><label>Title<input name="title" required></label><label>Resource URL<input name="url" type="url" pattern="https?://.*" required placeholder="https://..."></label><label>Description<textarea name="description"></textarea></label><button class="primary">Save resource →</button></form>`)};
function support(){return head('Help & Support','A little guidance goes a long way.')+`<div class="grid two">${[['Create a course','Open My Courses → Create Course. Add your course details and curriculum, then save or publish it.'],['Manage your cohort','Use Workspaces & Careers → Bulk Onboarding to preview and import a CSV roster.'],['Set up your instructor profile','Open Faculty Profile in the bottom rail. Your instructor identity is shared with the existing Torpedo login.'],['Review student work','Open Evaluations to record a score and feedback. This preview uses sample submissions; actual files require the institution’s service.']].map(x=>`<section class="card"><h3>${x[0]}</h3><p style="margin-top:15px">${x[1]}</p></section>`).join('')}</div>`}
window.addEventListener('storage',e=>{if(e.key==='torpedoCourses'){try{courses=JSON.parse(e.newValue||'[]');render()}catch{}}});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.querySelector('[aria-label="Global search"]')?.focus()}if(e.key==='Escape'){closeModal();document.body.classList.remove('mobile-nav-open')}});render();
</script></body></html>
